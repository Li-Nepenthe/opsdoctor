name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
  workflow_dispatch:

# 只读权限足够检出和验证源码，检查任务不应修改仓库。
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # 阶段 3 多了十个容器，给首次镜像下载和真实管道冒烟留出时间。
    env:
      LLM_PROVIDER: "mock" # 单元测试、集成和冒烟都不能触发付费诊断。
      LOADGEN_QPS: "0" # 空库准备期间不发送业务流量，后面单独运行有时长的冒烟压测。
      LOADGEN_PRODUCT_COUNT: "100" # CI 使用 small 造数，不请求不存在的商品。
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: 检查格式
        run: |
          files=$(gofmt -l cmd gen internal tools)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: 检查模块文件没有遗漏
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
      - name: 注释和架构
        run: |
          go run ./tools/commentcheck ./...
          go run ./tools/archcheck ./...
      - name: 单元测试与竞态检查（无外部依赖）
        run: go test -race ./... -count=1 -timeout=180s
      - name: 检查另一构建版本能编译
        run: go build -tags leakbug -o "$RUNNER_TEMP/order-service-alternate" ./cmd/order-service
      - name: 启动固定版本基础设施并等待健康
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 240
          # 空库初始化时尚无业务表；服务健康说明迁移已完成，此时才授予精确的表级权限。
          docker compose --env-file .env -f deploy/docker-compose.yml exec -T shop-mysql bash /docker-entrypoint-initdb.d/005_chaos_user.sh
          docker compose --env-file .env -f deploy/docker-compose.yml exec -T shop-mysql bash /docker-entrypoint-initdb.d/006_doctor_readonly.sh
          docker compose --env-file .env -f deploy/docker-compose.yml exec -T shop-mysql bash /docker-entrypoint-initdb.d/007_doctor_index.sh
          docker compose --env-file .env -f deploy/docker-compose.yml ps
      - name: MySQL 和 Redis 集成测试与竞态检查
        # .env.example 只含演示假值；通过环境注入，不把密码写入工作流。
        run: |
          while IFS= read -r line; do
            case "$line" in
              TEST_MYSQL_DSN=*|TEST_MIGRATE_MYSQL_DSN=*|TEST_INVENTORY_MYSQL_DSN=*|TEST_SEED_MYSQL_DSN=*|TEST_ORDER_MYSQL_DSN=*|TEST_SALES_MYSQL_DSN=*|TEST_REDIS_ADDR=*|TEST_REDIS_PASSWORD=*|TEST_SHOP_MYSQL_RO_DSN=*|TEST_SHOP_MYSQL_DDL_DSN=*|TEST_SHOP_REDIS_RO_URL=*|TEST_DOCTOR_MYSQL_DSN=*) export "$line" ;;
            esac
          done < .env
          # 医生自己的空闲连接也计入账号上限；先暂停它，再独占验证第四条连接被拒绝。
          docker compose --env-file .env -f deploy/docker-compose.yml stop doctor alertmanager
          trap 'docker compose --env-file .env -f deploy/docker-compose.yml start doctor alertmanager' EXIT
          # Go 把 Skip 也算作正常退出，必须另查事件，避免漏配变量时 CI 假绿。
          go test -race ./internal/platform/mysqlx ./internal/platform/migrate ./internal/shop/inventory ./internal/shop/seed ./internal/shop/order ./internal/shop/sales ./internal/shop/product ./internal/doctor/store ./internal/doctor/source/mysqlinspect ./internal/doctor/source/redisinspect ./internal/doctor/approval ./tools/recoverycheck -run Integration -count=1 -timeout=90s -json | tee "$RUNNER_TEMP/integration.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          events = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'integration.jsonl').read_text().splitlines()]
          skipped = [e['Test'] for e in events if e.get('Test') and e['Action'] == 'skip']
          passed = [e['Test'] for e in events if e.get('Test') and e['Action'] == 'pass']
          assert passed and not skipped, {'passed': len(passed), 'skipped': skipped}
          print(f'集成测试 pass={len(passed)}, skip={len(skipped)}')
          PY
      - name: 库存服务与 small 造数冒烟
        run: |
          while IFS= read -r line; do
            case "$line" in
              MYSQL_DSN=*|INVENTORY_GRPC_TARGET=*) export "$line" ;;
            esac
          done < .env
          go run ./cmd/shopctl seed --small
          go run ./cmd/shopctl seed --small
          go run ./cmd/shopctl stock get --sku 1
          go run ./cmd/shopctl stock deduct --sku 1 --quantity 1
          go run ./cmd/shopctl stock get --sku 1
      - name: 网络实验与恢复冒烟
        run: |
          go run ./cmd/chaos list
          # small 数据不用于完整故障验收；这里检查真实代理规则的增加与恢复。
          trap 'go run ./cmd/chaos restore-all' EXIT
          go run ./cmd/chaos inject S07 --latency-ms 50
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8474/proxies/order-inventory') as response:
              proxy = json.load(response)
          assert any(t['name'] == 'transport-delay' and t['attributes']['latency'] == 50 for t in proxy['toxics'])
          with urllib.request.urlopen('http://127.0.0.1:8081/products/99', timeout=5) as response:
              assert json.load(response)['data']['stock']['status'] == 'ok'
          PY
          go run ./cmd/chaos restore S07
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8474/proxies/order-inventory') as response:
              assert json.load(response)['toxics'] == []
          PY
      - name: 订单 HTTP、幂等和消息冒烟
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import uuid
          import os
          from pathlib import Path

          trace_id = uuid.uuid4().hex
          # 四个真实 HTTP 接口都经过运行中的订单服务，不把内部函数返回值当成接口验收。
          def call(path, body=None, key=None):
              headers = {'traceparent': '00-' + trace_id + '-1234567890abcdef-01'}
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
                  headers['Content-Type'] = 'application/json'
                  headers['Idempotency-Key'] = key
              request = urllib.request.Request('http://127.0.0.1:8081' + path, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=5) as response:
                  return response.status, json.load(response)

          status, product = call('/products/99')
          assert status == 200 and product['data']['stock']['status'] == 'ok'
          key = 'ci-' + uuid.uuid4().hex
          body = {'user_id': 990000002, 'sku_id': 99, 'quantity': 2}
          first_status, first = call('/orders', body, key)
          second_status, second = call('/orders', body, key)
          assert first_status == second_status == 201
          assert first['data'] == second['data']
          order_id = first['data']['order_id']
          _, detail = call('/orders/' + str(order_id))
          _, page = call('/orders?user_id=990000002&page=1&page_size=20')
          assert detail['data']['quantity'] == 2
          assert len(page['data']['items']) == 1 and page['data']['items'][0]['order_id'] == order_id
          print('四个 HTTP 接口和同键回放通过，订单编号：', order_id)
          (Path(os.environ['RUNNER_TEMP']) / 'trace-id.txt').write_text(trace_id)
          PY
          # 单独端口和十秒时长避免与 Compose 中暂停的 loadgen 冲突。
          go run ./cmd/loadgen --qps 20 --duration 10s --products 100 --control 127.0.0.1:6071 > "$RUNNER_TEMP/loadgen-smoke.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'loadgen-smoke.jsonl').read_text().splitlines() if line.startswith('{')]
          result = next(row['statistics'] for row in rows if row.get('scope') == 'total')
          assert result['requests'] >= 150 and result['errors'] == 0 and result['dropped'] == 0, result
          print('真实 HTTP 压测冒烟：', result)
          PY
          while IFS= read -r line; do
            case "$line" in MYSQL_DSN=*) export "$line" ;; esac
          done < .env
          # Kafka 消费是异步的，给它有限追平时间，再要求真实总量一致。
          passed=false
          for attempt in $(seq 1 30); do
            if go run ./cmd/shopctl check; then passed=true; break; fi
            sleep 1
          done
          test "$passed" = true
      - name: 指标、调用链、日志和 Grafana 接线冒烟
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          # 合成时间线检查冷缓存与持续异常的边界；真实故障验收仍在本机单独记录。
          docker compose --env-file .env -f deploy/docker-compose.yml exec -T prometheus promtool test rules /etc/prometheus/rules/cache_alert.test.yaml
          docker compose --env-file .env -f deploy/docker-compose.yml exec -T prometheus promtool test rules /etc/prometheus/rules/goroutine_alert.test.yaml
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          values = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          auth = 'Basic ' + base64.b64encode(('admin:' + values['GRAFANA_ADMIN_PASSWORD']).encode()).decode()
          trace_id = (Path(os.environ['RUNNER_TEMP']) / 'trace-id.txt').read_text()

          def get(url, grafana=False):
              headers = {'Authorization': auth} if grafana else {}
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=5) as response:
                  return json.load(response)

          def verify():
              # up 只能证明采集端点可达；还要检查 exporter 能登录对应的中间件。
              for expression, count in [('up', 8), ('mysql_up', 1), ('redis_up', 1)]:
                  data = get('http://127.0.0.1:9090/api/v1/query?' + urllib.parse.urlencode({'query': expression}))['data']['result']
                  assert len(data) == count and all(float(row['value'][1]) == 1 for row in data), expression
              with urllib.request.urlopen('http://127.0.0.1:3100/ready', timeout=5) as response:
                  assert response.status == 200
              for uid in ['prometheus', 'loki', 'jaeger']:
                  health = get('http://127.0.0.1:3000/api/datasources/uid/' + uid + '/health', True)
                  assert health['status'] == 'OK', uid
              # Jaeger 升级曾移除这些路径，不能只测仍可用的按 ID 查询而漏掉搜索故障。
              for path in ['/api/services', '/api/services/order-service/operations', '/api/traces?service=order-service&limit=20&lookback=1h']:
                  result = get('http://127.0.0.1:3000/api/datasources/proxy/uid/jaeger' + path, True)
                  assert result['data'], path
              dashboard = get('http://127.0.0.1:3000/api/dashboards/uid/shop-overview', True)['dashboard']
              assert len(dashboard['panels']) == 12
              trace = get('http://127.0.0.1:16686/api/traces/' + trace_id)['data'][0]
              names = {process['serviceName'] for process in trace['processes'].values()}
              assert {'order-service', 'inventory-service', 'order-worker'} <= names, names
              # 从 Grafana 代理访问 Loki，避免 Loki 单独可用而 Grafana 数据源接错地址。
              expression = '{service=~"order-service|inventory-service|order-worker"} | json | trace_id="' + trace_id + '"'
              logs = get('http://127.0.0.1:3000/api/datasources/proxy/uid/loki/loki/api/v1/query_range?' + urllib.parse.urlencode({'query': expression, 'since': '15m', 'limit': 100}), True)
              services = {row['stream']['service'] for row in logs['data']['result']}
              assert {'order-service', 'inventory-service', 'order-worker'} <= services, services
              print('八个采集目标、三个数据源、十二面板、跨三个服务的 trace 和日志通过')

          # 采集、批量导出和日志传送都是异步过程，有限等待后必须真实成功，不能吞掉最后一次错误。
          deadline = time.monotonic() + 90
          while True:
              try:
                  verify()
                  break
              except Exception:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(2)
          PY
      - name: 医生登录、Mock诊断、SSE与告警去重冒烟
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --no-deps --wait doctor
          go build -o "$RUNNER_TEMP/doctorctl" ./cmd/doctorctl
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request, uuid
          from pathlib import Path
          values = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          def call(path, data=None, token=None):
              headers = {'Content-Type': 'application/json'}
              if token: headers['Authorization'] = 'Bearer ' + token
              body = json.dumps(data).encode() if data is not None else None
              with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8090' + path, data=body, headers=headers), timeout=15) as response:
                  return json.load(response)['data']
          token = call('/api/v1/auth/login', {'email': values['DOCTOR_ADMIN_EMAIL'], 'password': values['DOCTOR_ADMIN_PASSWORD']})['access_token']
          env = os.environ.copy()
          env['DOCTOR_URL'], env['DOCTOR_TOKEN'] = 'http://127.0.0.1:8090', token
          binary = str(Path(os.environ['RUNNER_TEMP']) / 'doctorctl')
          def cli(args):
              return json.loads(subprocess.run([binary] + args, env=env, capture_output=True, text=True, check=True).stdout)
          assert cli(['target', 'list']) == ['shop']
          assert len(cli(['tool', 'list', '--target', 'shop'])) == 16
          for name, args in [('service_topology', {}), ('mysql_show_indexes', {'table': 'stock'}), ('redis_info', {})]:
              result = cli(['tool', 'run', '--target', 'shop', name, '--args', json.dumps(args)])
              assert result['status'] == 'ok' and result['bytes'] <= 4096
          notification = {'status': 'firing', 'groupKey': 'ci-' + uuid.uuid4().hex, 'groupLabels': {'alertname': 'CIWebhook'}, 'alerts': [{'status': 'firing', 'labels': {'alertname': 'CIWebhook'}, 'startsAt': '2026-10-26T00:00:00Z', 'fingerprint': uuid.uuid4().hex[:16]}]}
          receipts = [call('/api/v1/targets/shop/alerts', notification, values['SHOP_ALERT_TOKEN']) for _ in range(3)]
          assert len({r['diagnosis_id'] for r in receipts}) == 1 and sum(r['created'] for r in receipts) == 1
          identifier = receipts[0]['diagnosis_id']
          deadline = time.monotonic() + 30
          while True:
              task = call('/api/v1/diagnoses/' + identifier, token=token)
              if task['status'] not in ['pending', 'running']: break
              assert time.monotonic() < deadline, 'Mock诊断没有结束'
              time.sleep(0.2)
          assert task['target'] == 'shop' and task['status'] == 'succeeded', task['status']
          assert task['model'].startswith('mock') and task['cost_micros'] == 0
          assert 'Mock 模式，不是真实诊断' in task['report']['summary']
          assert all(step['model'].startswith('mock') for step in task['steps'] if step['kind'] == 'llm')
          # 已提交报告也属于同一场未恢复故障，第四次通知不能再建付费候选。
          repeated = call('/api/v1/targets/shop/alerts', notification, values['SHOP_ALERT_TOKEN'])
          assert repeated['diagnosis_id'] == identifier and not repeated['created']
          # 结束后的 SSE 补发应有序覆盖全部持久化编号，收到终态后正常结束连接。
          req = urllib.request.Request('http://127.0.0.1:8090/api/v1/diagnoses/' + identifier + '/events', headers={'Authorization': 'Bearer ' + token, 'Last-Event-ID': '1'})
          with urllib.request.urlopen(req, timeout=10) as response:
              stream = response.read(262144).decode()
          seqs = [int(line[3:].strip()) for line in stream.splitlines() if line.startswith('id:')]
          assert seqs == list(range(2, task['last_seq'] + 1)), seqs
          status = call('/api/v1/status', token=token)
          assert status['provider'] == 'mock' and status['budget']['spent_micros'] == 0
          print('医生登录、十六项菜单、三种工具、四次通知仅一个任务、Mock报告与SSE补发通过；真实费用0')
          PY
      - name: 失败时记录容器状态
        if: failure()
        # CI 只使用 .env.example 的演示凭据；保留初始化日志，才能定位空数据卷启动失败。
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml ps --all
          docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color --tail 100 shop-mysql
      - name: 关闭 CI 的临时容器
        if: always()
        # 不删除用户数据：这是 CI runner 的独立项目，并且不使用 down -v。
        run: docker compose --env-file .env -f deploy/docker-compose.yml down
