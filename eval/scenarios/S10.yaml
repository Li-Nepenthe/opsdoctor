id: S10
title: 库存数据库链路延迟
inject:
  - {action: latency, proxy: inventory-mysql, stream: downstream, latency_ms: 200}
restore:
  - {action: clear_latency, proxy: inventory-mysql}
symptom:
  promql: 'histogram_quantile(0.99,sum by(le)(rate(rpc_server_duration_seconds_bucket{service="inventory-service"}[1m]))) > 0.2'
  within: 3m
  alerts: [InventoryLatencyHigh, InventoryCallFailures]
ground_truth:
  component: inventory-service->mysql
  mechanism: database_network_latency
  explanation: SQL 往返在链路中等待，查询和更新都受到影响。连接占用更久会带来排队，但索引没有消失。
evidence_milestones:
  - 库存服务多种 SQL span 同时变长
  - EXPLAIN 仍使用正确索引
  - 数据库执行和锁等待不足以解释客户端耗时
  - 区分连接池排队与数据库网络往返
