# 固定实现：https://github.com/open-telemetry/opentelemetry-demo/blob/3.1.0/src/checkout/main.go
id: OT04
title: 结账的支付调用无法连接
source_url: https://opentelemetry.io/docs/demo/feature-flags/
flag: paymentUnreachable
variant: "on"
symptoms: 本次窗口内结账请求出现失败。请定位故障组件、机制和影响范围，并给出可核对的证据。
symptom:
  promql: 'sum(increase(traces_span_metrics_calls_total{service_name="checkout",status_code="STATUS_CODE_ERROR"}[2m])) > 0'
  within: 3m
healthy_promql: '(sum(increase(traces_span_metrics_calls_total{service_name="checkout",status_code="STATUS_CODE_ERROR"}[2m])) or vector(0)) == 0 and sum(increase(traces_span_metrics_calls_total{service_name="checkout"}[2m])) > 0'
ground_truth:
  component: checkout->payment
  mechanism: checkout_uses_invalid_payment_address
  explanation: checkout 在 chargeCard 中把支付客户端改为连接 badAddress:50051，导致名称解析或建立连接失败。根因是调用方使用错误的支付目标地址，不能把没有收到请求的正常 payment 进程直接判为崩溃。
evidence_milestones:
  - 指标或调用链显示本次 checkout 结账出现错误
  - 调用链把失败缩小到 checkout 发出的支付调用
  - 日志或错误事件显示 badAddress 名称解析、连接或 UNAVAILABLE 错误
  - 对照失败链路及 payment 同期记录，说明缺少对应服务端处理证据，不能仅据此宣称支付进程宕机
