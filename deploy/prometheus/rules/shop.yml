# 这里只写用户能观察到的症状。规则不能预先给出“索引被删了”之类的原因。
groups:
  - name: shop-symptoms
    rules:
      - alert: OrderLatencyHigh
        expr: histogram_quantile(0.99, sum by (service, le) (rate(http_server_request_duration_seconds_bucket{service="order-service",route="/orders",method="POST"}[1m]))) > 1
        for: 1m # 连续一分钟才报，过滤偶尔一次慢请求。
        labels: {severity: warning}
        annotations:
          summary: 下单接口 P99 持续超过一秒
      - alert: HTTPErrorRateHigh
        expr: sum by (service) (rate(http_server_request_duration_seconds_count{status=~"5.."}[1m])) / sum by (service) (rate(http_server_request_duration_seconds_count[1m])) > 0.05
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 服务端错误比例持续超过百分之五
      - alert: ConsumerLagHigh
        expr: sum(kafka_consumergroup_lag{consumergroup="order-worker",topic="order.created"}) > 1000
        for: 2m # 默认约 40 笔订单/秒，积压到门槛再持续两分钟，总计应小于三分钟。
        labels: {service: order-worker, severity: warning}
        annotations:
          summary: 订单消息积压持续超过一千条
      - alert: GoroutinesGrowing
        # 刚启动时连接池和后台任务会陆续建立，数量上涨本身不是泄漏。
        # 本机冷启动增长超过门槛的最后一个样本在进程启动 65 秒处；留到 90 秒再判断。
        # 按同一个服务实例匹配启动时间，避免别的进程已经运行很久就替它放行。
        expr: |
          deriv(go_goroutines{service=~"order-service|inventory-service|order-worker"}[2m]) > 1
          and on (job, instance, service)
          (time() - process_start_time_seconds{service=~"order-service|inventory-service|order-worker"}) > 90
        for: 1m # 一分钟持续每秒增长超过一个，避免把短暂并发增加当成泄漏原因。
        labels: {severity: warning}
        annotations:
          summary: 服务 goroutine 数持续上涨
      - alert: ServiceUnavailable
        expr: up{job="shop",service=~"order-service|inventory-service|order-worker"} == 0
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: 服务管理端口连续无法采集
      # 这些规则只描述可见症状，不根据发布参数推断索引或网络出了什么问题。
      - alert: InventoryLatencyHigh
        expr: histogram_quantile(0.99,sum by(service,le)(rate(rpc_server_duration_seconds_bucket{service="inventory-service"}[1m]))) > 0.2
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: 库存服务处理 RPC 的 P99 超过 200 毫秒
      - alert: OrderListLatencyHigh
        expr: histogram_quantile(0.99,sum by(service,le)(rate(http_server_request_duration_seconds_bucket{route="/orders",method="GET"}[1m]))) > 0.2
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: 订单列表 P99 超过 200 毫秒
      - alert: DatabasePoolWaiting
        expr: rate(go_sql_wait_count_total[1m]) > 1
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: 每秒超过一次请求需要等待数据库连接
      - alert: InventoryCallFailures
        expr: sum by(service)(rate(rpc_client_duration_seconds_count{code!="OK"}[1m])) / sum by(service)(rate(rpc_client_duration_seconds_count[1m])) > 0.1
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: 库存 RPC 调用失败比例超过百分之十
      - alert: InventoryRequestsAmplified
        expr: (sum(rate(rpc_client_retries_total[1m])) > 100) and (sum(rate(rpc_server_duration_seconds_count{service="inventory-service"}[1m])) / sum(rate(http_server_request_duration_seconds_count{service="order-service"}[1m])) > 2)
        for: 30s
        labels: {service: order-service, severity: warning}
        annotations:
          summary: 库存查询重试增加，下游请求量超过入口两倍
      - alert: RowLockWaiting
        expr: rate(mysql_global_status_innodb_row_lock_time[1m]) > 10
        for: 30s
        labels: {service: shop-mysql, severity: warning}
        annotations:
          summary: 数据库每秒累计行锁等待超过十毫秒
      - alert: CacheLoadsHigh
        # 每个商品请求最多需要一次正常回源。用比例比较，避免流量变大就越过固定次数。
        # 停流后缓存会自然过期。还要确认两分钟前已有流量，给正常重新填充留出时间。
        # 两个流量窗口都超过 20 次每秒，避免少量请求把比例放大；阈值由阶段 4 复测校准。
        expr: |
          (
            sum by (service) (rate(cache_loads_total{service="order-service",cache="product"}[1m]))
            /
            sum by (service) (rate(http_server_request_duration_seconds_count{service="order-service",route="/products/:id",method="GET"}[1m]))
          ) > 0.35
          and
          sum by (service) (rate(http_server_request_duration_seconds_count{service="order-service",route="/products/:id",method="GET"}[1m])) > 20
          and
          sum by (service) (rate(http_server_request_duration_seconds_count{service="order-service",route="/products/:id",method="GET"}[1m] offset 2m)) > 20
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: 持续有商品流量时，回源比例超过百分之三十五并持续三十秒
