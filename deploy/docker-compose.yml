# 阶段 4 共 18 个容器；内存设上限，宿主机端口只映射到本机。
name: opsdoctor
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m" # Alloy 读取 Docker 日志，源文件也需轮换，不能无限增长。
    max-file: "3"
services:
  inventory-service:
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        CMD_NAME: inventory-service
        APP_VERSION: ${APP_VERSION:-20261026.1}
    image: ${INVENTORY_IMAGE:-opsdoctor/inventory-service:20261026.1}
    environment:
      MYSQL_DSN: app:${MYSQL_PASSWORD:?请设置本机 MySQL 密码}@tcp(toxiproxy:13306)/shop?parseTime=true
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}
      GRPC_ADDR: :9001
      ADMIN_ADDR: :6062
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
    depends_on:
      shop-mysql:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:6062:6062"
    mem_limit: 128m # gRPC 和小连接池不需要大堆，避免本机靶场挤占数据库内存。
    logging: *bounded-logging
    stop_grace_period: 15s # 大于程序的 10 秒排空预算，让强制关闭和数据库清理也有时间完成。
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:6062/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s # 首次启动需要迁移，再开始计算失败次数。

  order-service:
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        CMD_NAME: order-service
        APP_VERSION: ${APP_VERSION:-20261026.1}
        GO_TAGS: ${ORDER_GO_TAGS:-}
    image: ${ORDER_IMAGE:-opsdoctor/order-service:20261026.1}
    environment:
      MYSQL_DSN: app:${MYSQL_PASSWORD:?请设置本机 MySQL 密码}@tcp(shop-mysql:3306)/shop?parseTime=true
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}
      HTTP_ADDR: :8081
      ADMIN_ADDR: :6061
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      REDIS_ADDR: toxiproxy:16379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置业务 Redis 密码}
      KAFKA_BROKERS: kafka:29092
      INVENTORY_GRPC_TARGET: toxiproxy:19001
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-3s}
      ORDER_CLEANUP_TIMEOUT: ${ORDER_CLEANUP_TIMEOUT:-2s}
      ORDER_PUBLISH_TIMEOUT: ${ORDER_PUBLISH_TIMEOUT:-5s}
      INVENTORY_CALL_TIMEOUT: ${INVENTORY_CALL_TIMEOUT:-800ms}
      INVENTORY_GRPC_IDLE_TIMEOUT: ${INVENTORY_GRPC_IDLE_TIMEOUT:-30m}
      INVENTORY_GETSTOCK_MAX_RETRIES: ${INVENTORY_GETSTOCK_MAX_RETRIES:-2}
      INVENTORY_GETSTOCK_ATTEMPT_TIMEOUT: ${INVENTORY_GETSTOCK_ATTEMPT_TIMEOUT:-0s}
      INVENTORY_RETRY_BACKOFF: ${INVENTORY_RETRY_BACKOFF:-50ms}
      INVENTORY_RETRY_MIN_BUDGET: ${INVENTORY_RETRY_MIN_BUDGET:-50ms}
      INVENTORY_BREAKER_ENABLED: ${INVENTORY_BREAKER_ENABLED:-true}
      INVENTORY_BREAKER_MIN_REQUESTS: ${INVENTORY_BREAKER_MIN_REQUESTS:-10}
      INVENTORY_BREAKER_FAILURE_PERCENT: ${INVENTORY_BREAKER_FAILURE_PERCENT:-50}
      INVENTORY_BREAKER_INTERVAL: ${INVENTORY_BREAKER_INTERVAL:-10s}
      INVENTORY_BREAKER_OPEN_TIMEOUT: ${INVENTORY_BREAKER_OPEN_TIMEOUT:-5s}
      INVENTORY_BREAKER_HALF_OPEN_MAX: ${INVENTORY_BREAKER_HALF_OPEN_MAX:-1}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-500}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
      CACHE_SINGLEFLIGHT: ${CACHE_SINGLEFLIGHT:-true}
      CACHE_TTL_JITTER: ${CACHE_TTL_JITTER:-60s}
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-24h}
    depends_on:
      shop-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:6061:6061"
    mem_limit: 256m # Gin、三个下游客户端和连接池共用这份进程预算。
    logging: *bounded-logging
    stop_grace_period: 90s # 容纳最大请求、消息确认、三次状态收尾和关闭连接的预算。
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:6061/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s

  order-worker:
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        CMD_NAME: order-worker
        APP_VERSION: ${APP_VERSION:-20261026.1}
    image: opsdoctor/order-worker:phase-03
    environment:
      MYSQL_DSN: app:${MYSQL_PASSWORD:?请设置本机 MySQL 密码}@tcp(shop-mysql:3306)/shop?parseTime=true
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}
      ADMIN_ADDR: :6063
      OTEL_SERVICE_NAME: order-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      KAFKA_BROKERS: kafka:29092
      WORKER_MESSAGE_TIMEOUT: ${WORKER_MESSAGE_TIMEOUT:-10s}
    depends_on:
      shop-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:6063:6063"
    mem_limit: 128m
    logging: *bounded-logging
    stop_grace_period: 45s # 当前消息最多三十秒，另给关闭连接留余量。
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:6063/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s

  loadgen:
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        CMD_NAME: loadgen
        APP_VERSION: ${APP_VERSION:-20261026.1}
    image: opsdoctor/loadgen:phase-03
    environment:
      LOADGEN_TARGET: http://order-service:8081
      LOADGEN_ADDR: :6070
      LOADGEN_QPS: ${LOADGEN_QPS:-200}
      LOADGEN_PRODUCT_COUNT: ${LOADGEN_PRODUCT_COUNT:-500000}
      LOADGEN_WORKERS: ${LOADGEN_WORKERS:-64}
      LOADGEN_REQUEST_TIMEOUT: ${LOADGEN_REQUEST_TIMEOUT:-3s}
      LOADGEN_DURATION: ${LOADGEN_DURATION:-0s}
    depends_on:
      order-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:6070:6070"
    mem_limit: 128m # 固定工作者和直方图，不随运行时长保存全部请求样本。
    logging: *bounded-logging
    stop_grace_period: 75s # 最多两次三十秒尝试，再留连接清理余量。
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:6070/health"]
      interval: 5s
      timeout: 4s
      retries: 12

  shop-mysql:
    image: mysql:8.4.13
    # 固定 8.4 LTS 的具体补丁版本，避免拉取新镜像时悄悄改变数据库行为。
    environment:
      MYSQL_DATABASE: shop
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?请设置监控账号密码}
      CHAOS_MYSQL_PASSWORD: ${CHAOS_MYSQL_PASSWORD:?请设置独立实验账号密码}
      SHOP_MYSQL_RO_PASSWORD: ${SHOP_MYSQL_RO_PASSWORD:?请设置医生只读账号密码}
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请复制 .env.example 为 .env 并指定 --env-file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置本机 MySQL root 密码}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - shop-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Buffer pool 只取 256 MiB，给连接、系统表与启动过程留出容器内存余量。
    command: ["--innodb-buffer-pool-size=268435456", "--max-connections=100"]
    # 原 768 MiB 上限已接近实测占用；提高容器余量，保留原 buffer pool 和连接数，避免同时改变查询缓存容量。
    mem_limit: 1536m
    logging: *bounded-logging
    healthcheck:
      # 真正登录并查询，而不是仅检查端口打开。密码由容器环境传递，不拼进进程参数。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -uapp -Dshop --silent --skip-column-names -e 'SELECT 1' >/dev/null"]
      interval: 5s # 便于本机观察启动过程，避免密集探测。
      timeout: 3s # 单次本机查询通常很快，异常时尽快失败。
      retries: 30 # 初次初始化允许约两分半的等待。
      start_period: 30s # 初始化期间的失败不提前耗尽重试次数。

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host", "0.0.0.0", "-config", "/config/proxies.json"]
    volumes:
      - ./toxiproxy/proxies.json:/config/proxies.json:ro
    ports:
      - "127.0.0.1:8474:8474" # 只有宿主机操作者可以从映射端口改变网络规则。
    mem_limit: 128m # TCP 转发与有限延迟队列共用上限，不能挤占数据库预算。
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.10.2
    ports:
      - "127.0.0.1:6379:6379"
    # Redis 现在还保存幂等凭据，不能因缓存淘汰而让旧请求重新执行。
    # noeviction 在内存用完时拒绝新写入；AOF 每次确认前刷盘，普通重启保留未到期记录。
    # 连续实验累积约三十万个幂等键后曾耗尽 128 MiB。扩大容量，不清键或缩短承诺的保存期限。
    # 数据上限之外再留 256 MiB，容纳分配器、连接与 AOF 重写时的额外内存；仍须实测监控。
    entrypoint: ["sh", "/usr/local/bin/start-with-acl.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置业务 Redis 密码}
      SHOP_REDIS_RO_PASSWORD: ${SHOP_REDIS_RO_PASSWORD:?请设置医生 Redis 密码}
    command: ["--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
      - ./redis/start-with-acl.sh:/usr/local/bin/start-with-acl.sh:ro
    tmpfs: ["/run/redis-acl:mode=0700,size=1m"]
    mem_limit: 768m
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12 # Redis 不需要初始化业务数据，给一分钟启动窗口即可。

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 容器内客户端和宿主机客户端必须收到各自可达的 advertised 地址。
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 单节点实验环境只能使用一个副本；这不提供生产环境的高可用保证。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 固定集群 ID 是身份标识，不是密钥；重启同一个数据卷时必须保持一致。
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      # 官方镜像预先给该目录授予 appuser 写权限，新卷会继承目录权限。
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1024m # 堆最多 512 MiB，另一半留给 JVM 原生内存和文件缓存。
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null"]
      interval: 10s # Kafka CLI 启动 JVM 有开销，不宜每秒探测。
      timeout: 10s
      retries: 18 # 首次格式化 KRaft 元数据允许三分钟。
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=1GB"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 512m
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    # 用户批准的唯一版本例外：新版移除 Grafana 仍在调用的查询路径，详见 docs/decisions.md。
    image: jaegertracing/jaeger:2.20.0
    command: ["--config=/etc/jaeger/config.yml"]
    volumes: ["./jaeger/jaeger.yml:/etc/jaeger/config.yml:ro"]
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4317:4317"]
    mem_limit: 1024m # 30000 条 trace 给告警与后续排查留时间；重启仍会清空内存后端。
    logging: *bounded-logging

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 512m
    logging: *bounded-logging
    # 官方精简镜像没有 wget；就绪状态由验收脚本通过 /ready 查询，不伪造容器健康状态。

  alloy:
    image: grafana/alloy:v1.21.2
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_started
    mem_limit: 256m
    logging: *bounded-logging
    # Docker socket 只交给日志采集器；:ro 不等于 Docker API 只读权限，医生永远不能挂载它。

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请设置 Grafana 管理员密码}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 256m
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    command: ["--mysqld.address=shop-mysql:3306", "--mysqld.username=metrics", "--config.my-cnf=/dev/null"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?请设置监控账号密码}
    depends_on:
      shop-mysql:
        condition: service_healthy
    mem_limit: 64m
    logging: *bounded-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.95.0
    command: ["--redis.addr=redis://redis:6379"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置业务 Redis 密码}
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 64m
    logging: *bounded-logging

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    command: ["--kafka.server=kafka:29092", "--group.filter=order-worker", "--topic.filter=order.created", "--offset.show-all", "--refresh.metadata=10s"]
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 64m
    logging: *bounded-logging

  alertmanager:
    image: prom/alertmanager:v0.34.1
    # Alertmanager 不自动展开配置中的环境变量。只把令牌写到本容器的临时内存文件。
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'umask 077; printf "%s" "$$SHOP_ALERT_TOKEN" > /run/secrets/alert-token; exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager'
    environment:
      SHOP_ALERT_TOKEN: ${SHOP_ALERT_TOKEN:?请设置告警推送令牌}
    tmpfs: ["/run/secrets:mode=1777,size=64k"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    depends_on:
      doctor:
        condition: service_healthy
    mem_limit: 64m
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  doctor-mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: doctor
      MYSQL_USER: doctor
      MYSQL_PASSWORD: ${DOCTOR_MYSQL_PASSWORD:?请设置医生数据库密码}
      MYSQL_ROOT_PASSWORD: ${DOCTOR_MYSQL_ROOT_PASSWORD:?请设置医生数据库 root 密码}
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - doctor-mysql-data:/var/lib/mysql
      - ./doctor/mysql-init:/docker-entrypoint-initdb.d:ro
    # 这里只保存医生的任务，不承担靶场查询；小缓冲池并关闭未使用的性能采集，节省本机内存。
    command: ["--innodb-buffer-pool-size=67108864", "--max-connections=30", "--performance-schema=OFF"]
    mem_limit: 512m
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h127.0.0.1 -udoctor -Ddoctor --silent --skip-column-names -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  doctor:
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        CMD_NAME: doctor
        APP_VERSION: ${APP_VERSION:-20261027.1}
    image: opsdoctor/doctor:20261027.1
    environment:
      GIN_MODE: release
      DOCTOR_ADDR: :8090
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      LLM_INPUT_PRICE_PER_MTOKEN: ${LLM_INPUT_PRICE_PER_MTOKEN:-2}
      LLM_OUTPUT_PRICE_PER_MTOKEN: ${LLM_OUTPUT_PRICE_PER_MTOKEN:-8}
      LLM_CACHE_HIT_PRICE_PER_MTOKEN: ${LLM_CACHE_HIT_PRICE_PER_MTOKEN:-0.04}
      LLM_BUDGET_ACCOUNT: ${LLM_BUDGET_ACCOUNT:-phase-07-08}
      LLM_TOTAL_BUDGET_CNY: ${LLM_TOTAL_BUDGET_CNY:-10}
      DOCTOR_MAX_CONCURRENT: ${DOCTOR_MAX_CONCURRENT:-2}
      DOCTOR_MAX_CONCURRENT_PER_TARGET: ${DOCTOR_MAX_CONCURRENT_PER_TARGET:-1}
      DOCTOR_ALERT_PENDING_MAX_AGE: ${DOCTOR_ALERT_PENDING_MAX_AGE:-5m}
      DOCTOR_ALERT_SILENCE_TIMEOUT: ${DOCTOR_ALERT_SILENCE_TIMEOUT:-15m}
      DOCTOR_COOKIE_SECURE: ${DOCTOR_COOKIE_SECURE:-false}
      DOCTOR_MYSQL_DSN: "doctor:${DOCTOR_MYSQL_PASSWORD:?请设置医生数据库密码}@tcp(doctor-mysql:3306)/doctor?parseTime=true"
      DOCTOR_ADMIN_EMAIL: ${DOCTOR_ADMIN_EMAIL:?请设置初始登录邮箱}
      DOCTOR_ADMIN_PASSWORD: ${DOCTOR_ADMIN_PASSWORD:?请设置初始登录密码}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT 密钥}
      TARGETS_DIR: /etc/doctor/targets
      SHOP_ALERT_TOKEN: ${SHOP_ALERT_TOKEN:?请设置 shop 告警令牌}
      SHOP_MYSQL_RO_DSN: ${SHOP_MYSQL_RO_DSN:?请设置 shop 只读 DSN，容器主机名为 shop-mysql}
      SHOP_REDIS_RO_URL: ${SHOP_REDIS_RO_URL:?请设置 shop 只读 URL，容器主机名为 redis}
    # 只挂接入配置，不挂仓库、实验场景、恢复记录或 Docker socket。
    volumes: ["./doctor/targets:/etc/doctor/targets:ro"]
    read_only: true
    cap_drop: [ALL]
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      doctor-mysql:
        condition: service_healthy
    mem_limit: 256m
    logging: *bounded-logging
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8090/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 24

volumes:
  doctor-mysql-data:
  shop-mysql-data:
  kafka-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:
  alertmanager-data:
