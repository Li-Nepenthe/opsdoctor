# 阶段 1 启动库存服务与基础依赖；所有宿主机端口只映射到本机。
name: opsdoctor
services:
  inventory-service:
    build:
      context: ..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        CMD_NAME: inventory-service
    image: opsdoctor/inventory-service:phase-01
    environment:
      MYSQL_DSN: app:${MYSQL_PASSWORD:?请设置本机 MySQL 密码}@tcp(shop-mysql:3306)/shop?parseTime=true
      DB_MAX_OPEN_CONNS: "20"
      DB_MAX_IDLE_CONNS: "10"
      DB_CONN_MAX_LIFETIME: 5m
      GRPC_ADDR: :9001
      ADMIN_ADDR: :6062
    depends_on:
      shop-mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:6062:6062"
    mem_limit: 128m # gRPC 和小连接池不需要大堆，避免本机靶场挤占数据库内存。
    stop_grace_period: 15s # 大于程序的 10 秒排空预算，让强制关闭和数据库清理也有时间完成。
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:6062/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s # 首次启动需要迁移，再开始计算失败次数。

  shop-mysql:
    image: mysql:8.4.13
    # 固定 8.4 LTS 的具体补丁版本，避免拉取新镜像时悄悄改变数据库行为。
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请复制 .env.example 为 .env 并指定 --env-file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置本机 MySQL root 密码}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - shop-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Buffer pool 只取 256 MiB，给连接、系统表与启动过程留出容器内存余量。
    command: ["--innodb-buffer-pool-size=268435456", "--max-connections=100"]
    mem_limit: 768m
    healthcheck:
      # 真正登录并查询，而不是仅检查端口打开。密码由容器环境传递，不拼进进程参数。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -uapp -Dshop --silent --skip-column-names -e 'SELECT 1' >/dev/null"]
      interval: 5s # 便于本机观察启动过程，避免密集探测。
      timeout: 3s # 单次本机查询通常很快，异常时尽快失败。
      retries: 30 # 初次初始化允许约两分半的等待。
      start_period: 30s # 初始化期间的失败不提前耗尽重试次数。

  redis:
    image: redis:8.10.2
    ports:
      - "127.0.0.1:6379:6379"
    # 数据预算小于容器上限，为客户端缓冲区和进程自身预留空间。
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12 # Redis 不需要初始化业务数据，给一分钟启动窗口即可。

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 容器内客户端和宿主机客户端必须收到各自可达的 advertised 地址。
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 单节点实验环境只能使用一个副本；这不提供生产环境的高可用保证。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 固定集群 ID 是身份标识，不是密钥；重启同一个数据卷时必须保持一致。
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      # 官方镜像预先给该目录授予 appuser 写权限，新卷会继承目录权限。
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1024m # 堆最多 512 MiB，另一半留给 JVM 原生内存和文件缓存。
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null"]
      interval: 10s # Kafka CLI 启动 JVM 有开销，不宜每秒探测。
      timeout: 10s
      retries: 18 # 首次格式化 KRaft 元数据允许三分钟。
      start_period: 30s

volumes:
  shop-mysql-data:
  kafka-data:
