# 医生只能从这里认识 shop；配置不包含任何实验场景或故障状态。
name: shop
profile: shop.profile.md
alert_token_env: SHOP_ALERT_TOKEN
# 最长 for 为 2m，再加一次规则评估 10s 和 group_wait 5s，共 135s；留到 3m。
# 这段时间里又收到 firing 仍归到原诊断。真正的新故障也可能被合并，可手动发起诊断。
alert_recovery_window: 3m
prometheus: http://prometheus:9090
jaeger: http://jaeger:16686
loki: http://loki:3100
mysql_readonly_dsn_env: SHOP_MYSQL_RO_DSN
redis_readonly_url_env: SHOP_REDIS_RO_URL
pprof:
  order-service: http://order-service:6061
  inventory-service: http://inventory-service:6062
  order-worker: http://order-worker:6063

# 外部 MCP 客户端只读入口使用独立令牌，不复用告警令牌或网页登录。
mcp_token_env: SHOP_MCP_TOKEN

# 写操作与只读查询分账号。DDL 可能需要几秒，独立预算仍受诊断剩余活动时间限制。
mysql_ddl_dsn_env: SHOP_MYSQL_DDL_DSN
write_timeout: 2m
ops_api:
  token_env: SHOP_OPS_TOKEN
  pool_min: 5
  pool_max: 200
  warm_cache_service: order-service
  services:
    inventory-service: http://inventory-service:6064
    order-service: http://order-service:6064
    order-worker: http://order-worker:6064
