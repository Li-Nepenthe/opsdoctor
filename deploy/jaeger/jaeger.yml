# 告警需要时间才能出现，排查时还要看得到故障刚开始的请求。
# 200 QPS、十分之一采样约产生 20 条 trace/秒；30000 条按此速率约容纳 25 分钟。
# 这是容量计算，实际保留时间和内存以数据台账的持续流量实验为准。重启后仍会清空。
extensions:
  jaeger_storage:
    backends:
      memory:
        memory:
          max_traces: 30000
  jaeger_query:
    storage:
      traces: memory
    http:
      endpoint: 0.0.0.0:16686
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 800 # 小于容器 1024 MiB，给 Go、查询结果与网络缓冲留余量。
    spike_limit_mib: 160
  batch:
    timeout: 1s
    send_batch_size: 512
exporters:
  jaeger_storage_exporter:
    trace_storage: memory
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: info
