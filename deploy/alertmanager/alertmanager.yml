# 这个 receiver 只对应 shop；所有症状合成一组，医生按整组恢复判断一场故障结束。
route:
  receiver: doctor-shop
  group_by: []
  group_wait: 5s
  group_interval: 15s
  # 持续故障每分钟重申一次，短于医生十五分钟的静默兜底，不会凭空开启第二场。
  repeat_interval: 1m
receivers:
  - name: doctor-shop
    webhook_configs:
      - url: http://doctor:8090/api/v1/targets/shop/alerts
        send_resolved: true
        max_alerts: 64
        http_config:
          authorization:
            type: Bearer
            # 启动时从环境变量写入容器的临时内存文件，仓库里不保存令牌。
            credentials_file: /run/secrets/alert-token
