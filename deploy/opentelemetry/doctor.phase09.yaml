# 阶段9只覆盖固定身份、预算和宿主评测端口；通用双服务定义来自../doctor/compose.yaml。
# 同时传两个-f文件；不使用原opsdoctor网络或阶段8数据库卷。
services:
  doctor:
    container_name: opsdoctor-phase09-doctor
    environment:
      LLM_BUDGET_ACCOUNT: phase-09-openai
      LLM_BUDGET_CURRENCY: USD
      LLM_TOTAL_BUDGET: "10"
      EVAL_COMPARISON_ACCOUNT: phase-09-deepseek
      EVAL_COMPARISON_TOTAL_CNY: "10"
    # 免费预检程序在内存/tmp中执行，不挂Docker socket或宿主仓库。
    tmpfs: ["/tmp:rw,exec,nosuid,size=32m,mode=1777"]
  doctor-mysql:
    container_name: opsdoctor-phase09-doctor-mysql
    # 仅宿主评测器连接新医生库，不能把旧阶段8的DSN带到新部署。
    ports: ["127.0.0.1:3309:3306"]
